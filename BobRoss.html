<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bob Ross Gallery</title>

  <link rel="icon" type="image/png" sizes="32x32" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAoCAIAAAC4b6kXAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAV0lEQVR4nO3MMQEAAAgDINc/9K3hBFQZFA4YyUYIuEDuRGzGZCmZCWYkmZCWYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TYk2TymX0FQ12RpkEAAAAASUVORK5CYII=" />

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: url('https://www.transparenttextures.com/patterns/paper-fibers.png') repeat #fdf6e3;
      overflow-x: hidden;
    }
    h1 { margin: 10px 0; transition: opacity 0.3s ease-in-out; }
    #gallery-container { margin-top: 10px; position: relative; display: inline-block; }
    #frame { display: inline-block; padding: 15px; border-radius: 8px; transition: all 0.4s ease-in-out; position: relative; z-index: 2; }
    #frame img {
      display: block;
      max-width: 75vw;
      max-height: 70vh;
      border: 4px solid #fff;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
      background-color: #fff;
      opacity: 0;
      transform: scale(1);
      transition: opacity 1s ease-in-out, transform 8s ease-in-out;
      margin: 0 auto;
    }
    #frame img.visible { opacity: 1; transform: scale(1.05); }
    #info { margin-top: 8px; font-size: 1.2em; transition: opacity 0.3s ease-in-out; }
    #colors {
      margin-top: 8px;
      font-size: 1em;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 75vw;
      margin-left: auto;
      margin-right: auto;
    }

    /* Color swatch boxes */
    #colors span {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
      font-size: 0.9em;
      user-select: none;
    }
    #colors span span {
      width: 16px;
      height: 16px;
      border: 1px solid #000;
      display: inline-block;
    }

    /* Spotlight effect for fullscreen */
    #spotlight {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.8) 100%);
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.5s ease-in-out;
    }

    /* Controls panel and buttons */
    #controls-panel {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 2px solid #ccc;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      z-index: 1000;
      transform: translateY(-100%);
      transition: transform 0.3s ease-in-out;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    #controls-panel.show { transform: translateY(0); }

    #controls-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-start;
      flex-grow: 1;
    }
    #controls-right {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-end;
    }

    select, input, button, label {
      font-size: 0.9em;
      margin: 4px;
      padding: 4px;
    }
    .nav-button {
      font-size: 1.5em; padding: 10px 20px; margin: 15px;
      background-color: #eee; border: 2px solid #444; border-radius: 6px; cursor: pointer;
    }
    .nav-button:hover { background-color: #ddd; }

    /* Frame styles */
    .gold-frame { background: linear-gradient(145deg, #d4af37, #b8860b); border: 8px solid #8b6f47; box-shadow: 0 0 0 6px #e0c97f, 0 8px 15px rgba(0,0,0,0.6); }
    .wood-frame { background: linear-gradient(145deg, #4b2e14, #3b1f0e); border: 8px solid #2a1407; box-shadow: 0 0 0 6px #6e4b2f, 0 8px 15px rgba(0,0,0,0.6); }
    .no-frame { background: none; border: none; box-shadow: none; padding: 0; }

    /* Progress bar */
    #progress-bar-container { margin: 10px auto; width: 60%; height: 10px; background: #ddd; border-radius: 5px; overflow: hidden; transition: opacity 0.3s ease-in-out; }
    #progress-bar { width: 0%; height: 100%; background: #b8860b; transition: width 0.5s ease-in-out; }

    /* Fullscreen adjustments */
    .fullscreen #frame img { max-width: 90vw; max-height: 85vh; display: block; margin-left: auto; margin-right: auto; }
    .fullscreen h1, .fullscreen #info, .fullscreen #progress-bar-container { opacity: 0; }
    .fullscreen #spotlight { display: block; opacity: 1; }

    /* Responsive */
    @media (max-width: 600px) {
      #controls-panel {
        flex-direction: column;
        align-items: stretch;
      }
      #controls-left, #controls-right {
        justify-content: center;
        margin: 4px 0;
      }
    }
  </style>
</head>
<body>
  <h1>Bob Ross Gallery</h1>

  <!-- Spotlight overlay -->
  <div id="spotlight"></div>

  <!-- Toggle buttons -->
  <button id="controls-toggle">⚙️ Controls</button>
  <button id="fullscreen-toggle">⛶ Fullscreen</button>

  <!-- Controls panel -->
  <div id="controls-panel">
    <div id="controls-left">
      <label for="seasonFilter">Season:</label>
      <select id="seasonFilter"><option value="all">All</option></select>
      <label for="frameStyle">Frame:</label>
      <select id="frameStyle">
        <option value="gold">Gold</option>
        <option value="wood">Wood</option>
        <option value="none">None</option>
      </select>
      <button id="pauseBtn">🛑 Pause</button>
    </div>
    <div id="controls-right">
      <button id="musicBtn">Play 🎵</button>
    </div>
  </div>

  <!-- Gallery -->
  <div id="gallery-container">
    <button class="nav-button" id="prevBtn">&#8592; Prev</button>
    <div id="frame" class="gold-frame">
      <img id="art-image" src="" alt="Bob Ross Painting" />
    </div>
    <button class="nav-button" id="nextBtn">Next &#8594;</button>
    <div id="info"></div>
    <div id="colors"></div>
    <div id="progress-bar-container"><div id="progress-bar"></div></div>
  </div>

  <!-- SoundCloud Embed (hidden) -->
  <iframe
    id="soundcloud-embed"
    src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/176269722&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false"
    style="display:none;"
    allow="autoplay"
  ></iframe>

  <script src="https://w.soundcloud.com/player/api.js"></script>

  <script>
    let artworks = [], filteredArtworks = [];
    let currentIndex = 0, cycleInterval, historyStack = [];
    let isPaused = false;
    let musicPlaying = false;
    const musicBtn = document.getElementById('musicBtn');

    // SoundCloud widget setup
    const scIframe = document.getElementById('soundcloud-embed');
    const scWidget = SC.Widget(scIframe);

    // Load Bob Ross paintings JSON file
    async function loadArtworks() {
      const res = await fetch('bob_ross_paintings.json');
      artworks = await res.json();

      // Populate season filter dynamically
      const seasonSet = new Set(artworks.map(a => a.season));
      const seasonFilter = document.getElementById('seasonFilter');
      seasonSet.forEach(season => {
        const option = document.createElement('option');
        option.value = season;
        option.textContent = "Season " + season;
        seasonFilter.appendChild(option);
      });

      filteredArtworks = [...artworks]; // initially all
      showArtwork();
      startCycle();
    }

    function showArtwork() {
      if (!filteredArtworks.length) return;
      const art = filteredArtworks[currentIndex];
      const img = document.getElementById('art-image');
      img.classList.remove('visible');
      setTimeout(() => {
        img.src = art.img_src;
        img.alt = art.painting_title;
        img.onload = () => img.classList.add('visible');
      }, 200);

      const total = filteredArtworks.length;
      document.getElementById('info').textContent =
        `${art.painting_title} (Season ${art.season}, Episode ${art.episode})`;

      // Render color swatches side-by-side
      const colorsDiv = document.getElementById('colors');
      colorsDiv.innerHTML = ''; // clear before adding

      art.colors.forEach((color, i) => {
        const hex = art.color_hex[i];
        const colorSpan = document.createElement('span');
        colorSpan.title = color;
        colorSpan.style.display = 'flex';
        colorSpan.style.alignItems = 'center';
        colorSpan.style.gap = '6px';
        colorSpan.style.padding = '4px 8px';
        colorSpan.style.border = '1px solid #ccc';
        colorSpan.style.borderRadius = '6px';
        colorSpan.style.backgroundColor = '#fff';
        colorSpan.style.fontSize = '0.9em';
        colorSpan.style.userSelect = 'none';

        const swatch = document.createElement('span');
        swatch.style.width = '16px';
        swatch.style.height = '16px';
        swatch.style.backgroundColor = hex;
        swatch.style.border = '1px solid #000';
        swatch.style.display = 'inline-block';

        colorSpan.appendChild(swatch);
        colorSpan.appendChild(document.createTextNode(color));

        colorsDiv.appendChild(colorSpan);
      });

      document.getElementById('progress-bar').style.width = `${((currentIndex+1)/total)*100}%`;
    }

    function nextArtwork() {
      historyStack.push(currentIndex);
      currentIndex = (currentIndex + 1) % filteredArtworks.length;
      showArtwork();
    }

    function prevArtwork() {
      if (historyStack.length) {
        currentIndex = historyStack.pop();
        showArtwork();
      }
    }

    function startCycle() {
      if (!isPaused) {
        clearInterval(cycleInterval);
        cycleInterval = setInterval(nextArtwork, 7000);
      }
    }

    // Filters
    document.getElementById('seasonFilter').addEventListener('change', e => {
      const val = e.target.value;
      filteredArtworks = val === 'all'
        ? [...artworks]
        : artworks.filter(a => a.season === val);
      historyStack = [];
      currentIndex = 0;
      showArtwork();
      startCycle();
    });

    // Frame style
    function setFrameStyle(style) {
      const frame = document.getElementById('frame');
      frame.className = '';
      if (style === 'gold') frame.classList.add('gold-frame');
      else if (style === 'wood') frame.classList.add('wood-frame');
      else frame.classList.add('no-frame');
    }
    document.getElementById('frameStyle').addEventListener('change', e => setFrameStyle(e.target.value));
    setFrameStyle(document.getElementById('frameStyle').value);

    // Controls toggle
    const controlsPanel = document.getElementById('controls-panel');
    document.getElementById('controls-toggle').addEventListener('click', () => {
      controlsPanel.classList.toggle('show');
    });

    // Fullscreen toggle & spotlight
    const fullscreenBtn = document.getElementById('fullscreen-toggle');
    const spotlight = document.getElementById('spotlight');
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        document.body.classList.add('fullscreen');
        spotlight.style.display = "block";
        fullscreenBtn.textContent = "⛶ Exit Fullscreen";
      } else {
        document.exitFullscreen();
        document.body.classList.remove('fullscreen');
        spotlight.style.display = "none";
        fullscreenBtn.textContent = "⛶ Fullscreen";
      }
    });

    // Pause button
    document.getElementById('pauseBtn').addEventListener('click', () => {
      isPaused = !isPaused;
      if (isPaused) {
        clearInterval(cycleInterval);
        document.getElementById('pauseBtn').textContent = "▶️ Resume";
      } else {
        startCycle();
        document.getElementById('pauseBtn').textContent = "🛑 Pause";
      }
    });

    // Music button control
    musicBtn.addEventListener('click', () => {
      if (!musicPlaying) {
        scWidget.play();
        musicPlaying = true;
        musicBtn.textContent = "Pause 🎵";
      } else {
        scWidget.pause();
        musicPlaying = false;
        musicBtn.textContent = "Play 🎵";
      }
    });

    // Navigation buttons
    document.getElementById('nextBtn').addEventListener('click', () => {
      nextArtwork();
      startCycle();
    });
    document.getElementById('prevBtn').addEventListener('click', () => {
      prevArtwork();
      startCycle();
    });

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') {
        nextArtwork();
        startCycle();
      }
      if (e.key === 'ArrowLeft') {
        prevArtwork();
        startCycle();
      }
    });

    // Initialize
    loadArtworks();
  </script>
</body>
</html>
