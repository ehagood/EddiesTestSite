<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bob Ross Gallery</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
    background: url('https://www.transparenttextures.com/patterns/paper-fibers.png') repeat #fdf6e3;
    overflow-x: hidden;
  }
  h1 { margin: 10px 0; }

  /* Spotlight overlay */
  #spotlight {
    display: none;
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
    z-index: 1;
  }
  .fullscreen #spotlight { display: block; }

  /* Top buttons */
  #controls-toggle, #fullscreen-toggle {
    position: fixed; top: 10px; padding: 8px 14px;
    font-size: 1.2em; border: none; cursor: pointer; border-radius: 6px;
    background: #d4af37; color: white; z-index: 1100;
  }
  #controls-toggle { left: 10px; }
  #fullscreen-toggle { right: 10px; }

  /* Controls panel */
  #controls-panel {
    position: fixed; top: 50px; width: 100%;
    background: rgba(255, 255, 255, 0.95);
    border-bottom: 2px solid #ccc;
    z-index: 1000;
    transform: translateY(-100%);
    transition: transform 0.3s ease-in-out;
    padding: 10px;
  }
  #controls-panel.show { transform: translateY(0); }

  select, input, button, label { font-size: 0.9em; margin: 4px; padding: 4px; }
  #musicBtn { background: #d4af37; color: white; border: none; padding: 6px 12px; border-radius: 6px; }

  /* Gallery */
  #gallery-container { margin-top: 120px; display: inline-block; }
  #frame { display: flex; justify-content: center; align-items: center; padding: 15px; background: white; border-radius: 8px; }
  #frame img {
    max-width: 75vw; max-height: 70vh; border: 4px solid #fff;
    opacity: 0; transform: scale(1);
    transition: opacity 1s ease-in-out, transform 8s ease-in-out;
  }
  #frame img.visible { opacity: 1; transform: scale(1.05); }
  .fullscreen #gallery-container { margin-top: 50vh; transform: translateY(-50%); }
  .fullscreen #frame img { max-width: 90vw; max-height: 85vh; }

  #info { margin-top: 8px; font-size: 1.2em; }
  .nav-button { font-size: 1.5em; padding: 10px 20px; margin: 15px; background-color: #eee; border: 2px solid #444; border-radius: 6px; cursor: pointer; }
  .nav-button:hover { background-color: #ddd; }

  /* Colors row */
  .color-swatch { display: inline-block; width: 18px; height: 18px; margin-right: 6px; border: 1px solid #333; border-radius: 3px; vertical-align: middle; }
</style>
</head>
<body>
<h1>Bob Ross Gallery</h1>
<div id="spotlight"></div>

<!-- Top buttons -->
<button id="controls-toggle">⚙️ Controls</button>
<button id="fullscreen-toggle">⛶ Fullscreen</button>

<!-- Controls panel -->
<div id="controls-panel">
  <label for="speedControl">Speed:</label>
  <select id="speedControl">
    <option value="5000">5s</option>
    <option value="10000">10s</option>
    <option value="15000">15s</option>
  </select>
  <button id="pauseBtn">🛑 Pause</button>
  <button id="musicBtn">Play 🎵</button>
</div>

<!-- Gallery -->
<div id="gallery-container">
  <button class="nav-button" id="prevBtn">&#8592; Prev</button>
  <div id="frame">
    <img id="art-image" src="" alt="Bob Ross Painting" />
  </div>
  <button class="nav-button" id="nextBtn">Next &#8594;</button>
  <div id="info"></div>
</div>

<!-- Hidden SoundCloud -->
<iframe id="soundcloud-embed" style="display:none;" allow="autoplay"
  src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/176269722&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false&enable_api=true">
</iframe>
<script src="https://w.soundcloud.com/player/api.js"></script>

<script>
let artworks = [], currentIndex = 0, cycleInterval, cycleSpeed = 5000, isPaused = false;
const imgEl = document.getElementById('art-image'), infoEl = document.getElementById('info');
const controlsPanel = document.getElementById('controls-panel');
const scWidget = SC.Widget(document.getElementById('soundcloud-embed'));
let musicPlaying = false;

async function loadArtworks() {
  const res = await fetch('bob_ross_paintings.JSON');
  artworks = await res.json();
  showArtwork(); startCycle();
}

function showArtwork() {
  const art = artworks[currentIndex];
  imgEl.classList.remove('visible');
  setTimeout(() => { imgEl.src = art.img_src; imgEl.onload = () => imgEl.classList.add('visible'); }, 200);
  let colorsHTML = art.colors.map((c,i)=>`<span class="color-swatch" style="background:${art.color_hex[i]}"></span>${c}`).join(' &nbsp; ');
  infoEl.innerHTML = `<strong>${art.painting_title}</strong> (Season ${art.season}, Ep ${art.episode})<br>Colors: ${colorsHTML}`;
}

function nextArtwork(){ currentIndex=(currentIndex+1)%artworks.length; showArtwork(); }
function prevArtwork(){ currentIndex=(currentIndex-1+artworks.length)%artworks.length; showArtwork(); }
function startCycle(){ clearInterval(cycleInterval); if(!isPaused) cycleInterval=setInterval(nextArtwork,cycleSpeed); }

document.getElementById('controls-toggle').addEventListener('click',()=>controlsPanel.classList.toggle('show'));
document.getElementById('fullscreen-toggle').addEventListener('click',()=>{
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); document.body.classList.add('fullscreen'); }
  else { document.exitFullscreen(); document.body.classList.remove('fullscreen'); }
});
document.getElementById('prevBtn').addEventListener('click',()=>{prevArtwork();startCycle();});
document.getElementById('nextBtn').addEventListener('click',()=>{nextArtwork();startCycle();});
document.getElementById('speedControl').addEventListener('change',e=>{cycleSpeed=parseInt(e.target.value);startCycle();});
document.getElementById('pauseBtn').addEventListener('click',()=>{
  isPaused=!isPaused;
  if(isPaused){clearInterval(cycleInterval);document.getElementById('pauseBtn').textContent="▶️ Resume";}
  else {startCycle();document.getElementById('pauseBtn').textContent="🛑 Pause";}
});
document.getElementById('musicBtn').addEventListener('click',()=> musicPlaying?scWidget.pause():scWidget.play());
scWidget.bind(SC.Widget.Events.PLAY,()=>{musicPlaying=true;document.getElementById('musicBtn').textContent='Pause 🎵';});
scWidget.bind(SC.Widget.Events.PAUSE,()=>{musicPlaying=false;document.getElementById('musicBtn').textContent='Play 🎵';});

loadArtworks();
</script>
</body>
</html>
