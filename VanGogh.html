<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Van Gogh Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #fdf6e3;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 20px;
    }
    #gallery-container {
      margin-top: 20px;
      position: relative;
      display: inline-block;
    }
    #frame {
      display: inline-block;
      padding: 15px;
      border-radius: 8px;
      transition: all 0.4s ease-in-out;
    }
    #frame img {
      display: block;
      max-width: 75vw;
      max-height: 65vh;
      border: 4px solid #fff;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
      background-color: #fff;
    }
    #info {
      margin-top: 10px;
      font-size: 1.2em;
    }
    #controls {
      margin: 20px auto;
    }
    select, input, button {
      font-size: 1em;
      margin: 5px;
      padding: 5px;
    }
    .nav-button {
      font-size: 1.5em;
      padding: 10px 20px;
      margin: 15px;
      background-color: #eee;
      border: 2px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }
    .nav-button:hover {
      background-color: #ddd;
    }

    /* Frame styles */
    .gold-frame {
      background: linear-gradient(145deg, #d4af37, #b8860b);
      border: 8px solid #8b6f47;
      box-shadow: 0 0 0 6px #e0c97f, 0 8px 15px rgba(0,0,0,0.6);
    }
    .wood-frame {
      background: linear-gradient(145deg, #4b2e14, #3b1f0e);
      border: 8px solid #2a1407;
      box-shadow: 0 0 0 6px #6e4b2f, 0 8px 15px rgba(0,0,0,0.6);
    }
    .no-frame {
      background: none;
      border: none;
      box-shadow: none;
      padding: 0;
    }
  </style>
</head>
<body>
  <h1>Vincent van Gogh Gallery</h1>
  
  <div id="controls">
    <label for="seriesFilter">Filter by Series:</label>
    <select id="seriesFilter">
      <option value="all">All</option>
    </select>
    <label for="yearFilter">Year:</label>
    <input type="number" id="yearFilter" placeholder="e.g., 1889" min="1880" max="1890" />

    <label for="frameStyle">Frame Style:</label>
    <select id="frameStyle">
      <option value="gold">Gold Frame</option>
      <option value="wood">Wood Frame</option>
      <option value="none">No Frame</option>
    </select>
  </div>
  
  <div id="gallery-container">
    <button class="nav-button" id="prevBtn">&#8592; Prev</button>
    
    <div id="frame" class="gold-frame">
      <img id="art-image" src="" alt="Van Gogh Artwork" />
    </div>
    
    <button class="nav-button" id="nextBtn">Next &#8594;</button>
    <div id="info"></div>
  </div>

  <script>
    let artworks = [];
    let filteredArtworks = [];
    let currentIndex = 0;
    let cycleInterval;

    async function loadArtworks() {
      const res = await fetch('vangogh.json');
      artworks = await res.json();

      // Populate series dropdown dynamically
      const seriesSet = new Set(artworks.map(a => a.series));
      const seriesFilter = document.getElementById('seriesFilter');
      seriesSet.forEach(series => {
        const option = document.createElement('option');
        option.value = series;
        option.textContent = series;
        seriesFilter.appendChild(option);
      });

      filteredArtworks = [...artworks];
      showArtwork();
      startCycle();
    }

    function showArtwork() {
      if (filteredArtworks.length === 0) return;
      const art = filteredArtworks[currentIndex];
      document.getElementById('art-image').src = art.image;
      document.getElementById('info').textContent = `${art.title} (${art.date}) - ${art.series}`;
    }

    function nextArtwork() {
      if (filteredArtworks.length === 0) return;
      currentIndex = (currentIndex + 1) % filteredArtworks.length;
      showArtwork();
    }

    function prevArtwork() {
      if (filteredArtworks.length === 0) return;
      currentIndex = (currentIndex - 1 + filteredArtworks.length) % filteredArtworks.length;
      showArtwork();
    }

    function startCycle() {
      clearInterval(cycleInterval);
      cycleInterval = setInterval(nextArtwork, 5000); // cycle every 5s
    }

    // Event Listeners
    document.getElementById('seriesFilter').addEventListener('change', applyFilters);
    document.getElementById('yearFilter').addEventListener('input', applyFilters);
    document.getElementById('nextBtn').addEventListener('click', () => { nextArtwork(); startCycle(); });
    document.getElementById('prevBtn').addEventListener('click', () => { prevArtwork(); startCycle(); });

    // Frame style change
    document.getElementById('frameStyle').addEventListener('change', (e) => {
      const frameDiv = document.getElementById('frame');
      frameDiv.className = ''; // reset
      if (e.target.value === 'gold') frameDiv.classList.add('gold-frame');
      else if (e.target.value === 'wood') frameDiv.classList.add('wood-frame');
      else frameDiv.classList.add('no-frame');
    });

    function applyFilters() {
      const seriesValue = document.getElementById('seriesFilter').value;
      const yearValue = document.getElementById('yearFilter').value.trim();

      filteredArtworks = artworks.filter(a => {
        const matchesSeries = (seriesValue === 'all' || a.series === seriesValue);
        const matchesYear = (yearValue === '' || a.date === yearValue);
        return matchesSeries && matchesYear;
      });

      currentIndex = 0;
      showArtwork();
      startCycle();
    }

    window.onload = loadArtworks;
  </script>
</body>
</html>
