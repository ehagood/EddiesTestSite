<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Van Gogh Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: url('https://www.transparenttextures.com/patterns/paper-fibers.png') repeat #fdf6e3;
    }
    h1 {
      margin-top: 20px;
    }
    #gallery-container {
      margin-top: 20px;
      position: relative;
      display: inline-block;
    }
    #frame {
      display: inline-block;
      padding: 15px;
      border-radius: 8px;
      transition: all 0.4s ease-in-out;
    }
    #frame img {
      display: block;
      max-width: 75vw;
      max-height: 65vh;
      border: 4px solid #fff;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
      background-color: #fff;
      opacity: 0;
      transform: scale(1);
      transition: opacity 1s ease-in-out, transform 8s ease-in-out;
    }
    #frame img.visible {
      opacity: 1;
      transform: scale(1.05); /* Gentle zoom-in */
    }
    #info {
      margin-top: 10px;
      font-size: 1.2em;
    }
    #controls {
      margin: 20px auto;
    }
    select, input, button {
      font-size: 1em;
      margin: 5px;
      padding: 5px;
    }
    .nav-button {
      font-size: 1.5em;
      padding: 10px 20px;
      margin: 15px;
      background-color: #eee;
      border: 2px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }
    .nav-button:hover {
      background-color: #ddd;
    }

    /* Frame styles */
    .gold-frame {
      background: linear-gradient(145deg, #d4af37, #b8860b);
      border: 8px solid #8b6f47;
      box-shadow: 0 0 0 6px #e0c97f, 0 8px 15px rgba(0,0,0,0.6);
    }
    .wood-frame {
      background: linear-gradient(145deg, #4b2e14, #3b1f0e);
      border: 8px solid #2a1407;
      box-shadow: 0 0 0 6px #6e4b2f, 0 8px 15px rgba(0,0,0,0.6);
    }
    .no-frame {
      background: none;
      border: none;
      box-shadow: none;
      padding: 0;
    }
  </style>
</head>
<body>
  <h1>Vincent van Gogh Gallery</h1>
  
  <div id="controls">
    <label for="seriesFilter">Filter by Series:</label>
    <select id="seriesFilter">
      <option value="all">All</option>
    </select>
    <label for="yearFilter">Year:</label>
    <input type="number" id="yearFilter" placeholder="e.g., 1889" min="1880" max="1890" />

    <label for="frameStyle">Frame Style:</label>
    <select id="frameStyle">
      <option value="gold">Gold Frame</option>
      <option value="wood">Wood Frame</option>
      <option value="none">No Frame</option>
    </select>
  </div>
  
  <div id="gallery-container">
    <button class="nav-button" id="prevBtn">&#8592; Prev</button>
    
    <div id="frame" class="gold-frame">
      <img id="art-image" src="" alt="Van Gogh Artwork" />
    </div>
    
    <button class="nav-button" id="nextBtn">Next &#8594;</button>
    <div id="info"></div>
  </div>

  <script>
    let artworks = [];
    let filteredArtworks = [];
    let currentIndex = 0;
    let cycleInterval;
    let historyStack = [];
    const frameStyles = ['gold-frame', 'wood-frame', 'no-frame'];
    let currentFrameIndex = 0;

    async function loadArtworks() {
      const res = await fetch('vangogh.json');
      artworks = await res.json();

      // Populate series dropdown dynamically
      const seriesSet = new Set(artworks.map(a => a.series));
      const seriesFilter = document.getElementById('seriesFilter');
      seriesSet.forEach(series => {
        const option = document.createElement('option');
        option.value = series;
        option.textContent = series;
        seriesFilter.appendChild(option);
      });

      filteredArtworks = shuffleArray([...artworks]);
      showArtwork();
      startCycle();
    }

    function showArtwork() {
      if (filteredArtworks.length === 0) return;
      const art = filteredArtworks[currentIndex];
      const img = document.getElementById('art-image');

      // Fade out, swap, fade in
      img.classList.remove('visible');
      setTimeout(() => {
        img.src = art.image;
        img.onload = () => {
          img.classList.add('visible');
        };
      }, 200);

      document.getElementById('info').textContent = `${art.title} (${art.date}) - ${art.series}`;
    }

    function nextArtwork() {
      if (filteredArtworks.length === 0) return;
      historyStack.push(currentIndex);
      currentIndex = Math.floor(Math.random() * filteredArtworks.length);
      showArtwork();
    }

    function prevArtwork() {
      if (historyStack.length > 0) {
        currentIndex = historyStack.pop();
        showArtwork();
      }
    }

    function startCycle() {
      clearInterval(cycleInterval);
      cycleInterval = setInterval(nextArtwork, 5000);
    }

    function shuffleArray(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function applyFilters() {
      const seriesValue = document.getElementById('seriesFilter').value;
      const yearValue = document.getElementById('yearFilter').value.trim();

      filteredArtworks = artworks.filter(a => {
        const matchesSeries = (seriesValue === 'all' || a.series === seriesValue);
        const matchesYear = (yearValue === '' || a.date === yearValue);
        return matchesSeries && matchesYear;
      });

      filteredArtworks = shuffleArray(filteredArtworks);
      historyStack = [];
      currentIndex = 0;
      showArtwork();
      startCycle();
    }

    // Event Listeners
    document.getElementById('seriesFilter').addEventListener('change', applyFilters);
    document.getElementById('yearFilter').addEventListener('input', applyFilters);
    document.getElementById('nextBtn').addEventListener('click', () => { nextArtwork(); startCycle(); });
    document.getElementById('prevBtn').addEventListener('click', () => { prevArtwork(); startCycle(); });

    document.getElementById('frameStyle').addEventListener('change', (e) => {
      setFrameStyle(e.target.value);
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        nextArtwork();
        startCycle();
      }
      if (e.key === 'ArrowLeft') {
        prevArtwork();
        startCycle();
      }
      if (e.key.toLowerCase() === 'f') {
        currentFrameIndex = (currentFrameIndex + 1) % frameStyles.length;
        setFrameStyle(frameStyles[currentFrameIndex].split('-')[0]);
        document.getElementById('frameStyle').value = frameStyles[currentFrameIndex].split('-')[0];
      }
    });

    function setFrameStyle(style) {
      const frameDiv = document.getElementById('frame');
      frameDiv.className = '';
      if (style === 'gold') frameDiv.classList.add('gold-frame');
      else if (style === 'wood') frameDiv.classList.add('wood-frame');
      else frameDiv.classList.add('no-frame');
    }

    window.onload = loadArtworks;
  </script>
</body>
</html>
