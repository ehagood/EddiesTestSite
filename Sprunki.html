<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprunkis Interactive</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎵 Sprunkis Interactive 🎵</h1>

  <div id="sprunki-panel">
    <div class="sprunki" draggable="true" data-sound="beat1.mp3" data-img="sprunki-beat.png">
      <img src="assets/sprites/sprunki-beat.png" alt="Beat Sprunki" />
    </div>
    <div class="sprunki" draggable="true" data-sound="melody1.mp3" data-img="sprunki-melody.png">
      <img src="assets/sprites/sprunki-melody.png" alt="Melody Sprunki" />
    </div>
    <div class="sprunki" draggable="true" data-sound="vocal1.mp3" data-img="sprunki-vocal.png">
      <img src="assets/sprites/sprunki-vocal.png" alt="Vocal Sprunki" />
    </div>
    <div class="sprunki" draggable="true" data-sound="effect1.mp3" data-img="sprunki-effect.png">
      <img src="assets/sprites/sprunki-effect.png" alt="Effect Sprunki" />
    </div>
  </div>

  <h2>Drop Sprunkis Here:</h2>
  <div id="stage"></div>

  <script src="script.js"></script>
</body>
</html>
