<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Gallery</title>
  <link rel="apple-touch-icon" sizes="180x180" href="starry-night-icon.png" />
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 5px 10px;
      position: absolute;
      width: 100%;
      z-index: 10;
    }

    #leftControls, #rightControls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #art-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #frame {
      padding: 20px;
      background: transparent;
      transition: all 0.3s ease;
      max-width: 90vw;
      max-height: 80vh;
      display: inline-block;
    }

    #frame img {
      display: block;
      max-width: 100%;
      max-height: 80vh;
      margin: auto;
    }

    .gold-frame {
      border: 15px solid #d4af37;
      box-shadow: 0 0 20px rgba(212,175,55,0.8);
    }

    .wood-frame {
      border: 15px solid #8b4513;
      box-shadow: 0 0 20px rgba(139,69,19,0.8);
    }

    .no-frame {
      border: none;
    }

    #metadata {
      text-align: center;
      margin-top: 5px;
    }

    #controlsModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20,20,20,0.95);
      padding: 20px;
      border-radius: 10px;
      z-index: 20;
    }

    #controlsModal label {
      display: block;
      margin: 10px 0 5px;
    }

    #controlsModal button {
      margin-top: 10px;
    }

    #fullscreenBtn {
      font-size: 1.5em;
      cursor: pointer;
      background: none;
      border: none;
      color: white;
    }

    .fade {
      opacity: 0;
      transition: opacity 1s;
    }

    #navButtons {
      position: absolute;
      width: 100%;
      top: 50%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .nav-btn {
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      font-size: 2em;
      padding: 10px;
      cursor: pointer;
      pointer-events: all;
    }
  </style>
</head>
<body>
  <header>
    <div id="leftControls">
      <button id="controlsBtn">⚙️ Controls</button>
    </div>
    <div id="rightControls">
      <button id="fullscreenBtn">⛶</button>
    </div>
  </header>

  <div id="art-container">
    <div id="frame" class="gold-frame">
      <img id="art-image" src="" alt="Artwork">
    </div>
    <div id="navButtons">
      <button id="prevBtn" class="nav-btn">⟨</button>
      <button id="nextBtn" class="nav-btn">⟩</button>
    </div>
  </div>

  <div id="metadata"></div>

  <div id="controlsModal">
    <h2>Gallery Settings</h2>
    <label for="artistSelect">Artist:</label>
    <select id="artistSelect">
      <option value="vincent-van-gogh">Vincent van Gogh</option>
      <option value="bob-ross">Bob Ross</option>
    </select>

    <label for="frameStyle">Frame Style:</label>
    <select id="frameStyle">
      <option value="gold">Gold</option>
      <option value="wood">Wood</option>
      <option value="none">None</option>
    </select>

    <label for="seriesFilter">Filter by Series:</label>
    <select id="seriesFilter"><option value="all">All</option></select>

    <label>Order:</label>
    <label><input type="radio" name="order" value="random" checked> Random</label>
    <label><input type="radio" name="order" value="chronological"> Chronological</label>

    <button id="musicBtn">🎵 Toggle Music</button>
    <button id="closeControls">Close</button>
  </div>

  <audio id="bgMusic" loop>
    <source src="https://upload.wikimedia.org/wikipedia/commons/1/1e/Air_%28Bach%29.ogg" type="audio/ogg">
  </audio>

  <script>
    let artworks = [];
    let filteredArtworks = [];
    let currentIndex = 0;
    let historyStack = [];
    let cycleInterval;
    let currentArtist = 'vincent-van-gogh';

    async function loadArtworks(artist = currentArtist) {
      currentArtist = artist;
      const res = await fetch(`${artist}.json`);
      artworks = await res.json();
      setupSeriesFilter();
      filteredArtworks = shuffleArray([...artworks]);
      currentIndex = 0;
      historyStack = [];
      showArtwork();
      startCycle();
    }

    function setupSeriesFilter() {
      const seriesSet = new Set(artworks.map(a => a.series));
      const seriesFilter = document.getElementById('seriesFilter');
      seriesFilter.innerHTML = '<option value="all">All</option>';
      seriesSet.forEach(series => {
        const option = document.createElement('option');
        option.value = series;
        option.textContent = series;
        seriesFilter.appendChild(option);
      });
    }

    function showArtwork() {
      const art = filteredArtworks[currentIndex];
      const img = document.getElementById('art-image');
      const metadata = document.getElementById('metadata');

      img.classList.add('fade');
      setTimeout(() => {
        img.src = art.image;
        img.alt = art.title;
        metadata.innerHTML = `<h2>${art.title}</h2><p>${art.date}</p><p>${art.series}</p>`;
        img.classList.remove('fade');
      }, 500);
    }

    function nextArtwork() {
      historyStack.push(currentIndex);
      const order = document.querySelector('input[name="order"]:checked').value;
      if (order === 'random') {
        currentIndex = Math.floor(Math.random() * filteredArtworks.length);
      } else {
        currentIndex = (currentIndex + 1) % filteredArtworks.length;
      }
      showArtwork();
    }

    function prevArtwork() {
      if (historyStack.length > 0) {
        currentIndex = historyStack.pop();
        showArtwork();
      }
    }

    function shuffleArray(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function startCycle() {
      clearInterval(cycleInterval);
      cycleInterval = setInterval(nextArtwork, 8000);
    }

    document.getElementById('seriesFilter').addEventListener('change', (e) => {
      const value = e.target.value;
      filteredArtworks = (value === 'all') 
        ? [...artworks] 
        : artworks.filter(a => a.series === value);
      currentIndex = 0;
      historyStack = [];
      showArtwork();
    });

    document.querySelectorAll('input[name="order"]').forEach(radio => {
      radio.addEventListener('change', () => startCycle());
    });

    document.getElementById('frameStyle').addEventListener('change', (e) => {
      const frame = document.getElementById('frame');
      frame.className = '';
      if (e.target.value === 'gold') frame.classList.add('gold-frame');
      else if (e.target.value === 'wood') frame.classList.add('wood-frame');
      else frame.classList.add('no-frame');
    });

    document.getElementById('artistSelect').addEventListener('change', (e) => {
      loadArtworks(e.target.value);
    });

    document.getElementById('controlsBtn').addEventListener('click', () => {
      document.getElementById('controlsModal').style.display = 'block';
    });
    document.getElementById('closeControls').addEventListener('click', () => {
      document.getElementById('controlsModal').style.display = 'none';
    });

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    document.getElementById('musicBtn').addEventListener('click', () => {
      const music = document.getElementById('bgMusic');
      if (music.paused) music.play();
      else music.pause();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      nextArtwork();
      startCycle();
    });
    document.getElementById('prevBtn').addEventListener('click', () => {
      prevArtwork();
      startCycle();
    });

    loadArtworks();
  </script>
</body>
</html>
